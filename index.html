<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Wien 3D</title>
    <meta name="description" content="A playable 3D map of Vienna built from open government data." />
    <meta name="theme-color" content="#c8023c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wien 3D" />
    <style>
      /* Stadt Wien look, after sagswienmap.vercel.app */
      :root {
        --wien-red: #c8023c; --wien-red-dark: #a3002f; --wien-red-light: #fff0f4;
        --wien-text: #1a1a1a; --wien-text-muted: #555; --wien-border: #d4d4d4; --wien-border-strong: #b0b0b0;
        --wien-bg: #fff; --wien-bg-alt: #f5f5f5;
        --wien-shadow: 0 2px 6px #00000014; --wien-shadow-strong: 0 8px 24px #00000024; --wien-shadow-modal: 0 20px 44px #0000004d;
        --wien-radius: 4px;
        --font: 'Open Sans Variable','Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #b8d3ea; color: var(--wien-text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
      canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      .hidden { display: none !important; }
      body.soft-play, body.soft-play * { cursor: none !important; }
      h1, h2, h3 { letter-spacing: -.005em; }
      a { color: var(--wien-red); }
      a:hover { color: var(--wien-red-dark); }

      #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
      #aim-label { position: fixed; left: 50%; top: calc(50% + 20px); transform: translateX(-50%); max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
        background: #ffffff80; border: 1px solid #d4d4d480; border-radius: var(--wien-radius); box-shadow: var(--wien-shadow); padding: 3px 9px; font-size: 13px; font-weight: 600; }
      #aim-label:empty { display: none; }

      /* screen corners stack the status box and the compass (compass.js moves it to the chosen corner) */
      .corner { position: fixed; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .corner.tl, .corner.tr { top: max(12px, env(safe-area-inset-top)); }
      .corner.bl, .corner.br { bottom: max(12px, env(safe-area-inset-bottom)); }
      .corner.tl, .corner.bl { left: max(12px, env(safe-area-inset-left)); align-items: flex-start; }
      .corner.tr, .corner.br { right: max(12px, env(safe-area-inset-right)); align-items: flex-end; }

      /* status box, like the map's state panel */
      #hud { pointer-events: none; background: #fffffff0; border: 1px solid var(--wien-border); border-left: 4px solid var(--wien-red); border-radius: var(--wien-radius); box-shadow: var(--wien-shadow);
        padding: 7px 12px; font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
      #hud:empty { display: none; }

      #compass { width: 88px; height: 88px; border-radius: 50%; box-shadow: var(--wien-shadow-strong); }
      #compass svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #compass .c-face { fill: #fffffff0; stroke: var(--wien-border-strong); stroke-width: 1; }
      #compass .c-ring { fill: none; stroke: var(--wien-border); stroke-width: .8; }
      #compass .c-tick { stroke: var(--wien-border-strong); stroke-width: 1; stroke-linecap: round; }
      #compass .c-tick.major { stroke: var(--wien-text-muted); }
      #compass .c-tick.cardinal { stroke: var(--wien-text); stroke-width: 1.6; }
      #compass .c-tick.north { stroke: var(--wien-red); stroke-width: 2.2; }
      #compass .n1 { fill: var(--wien-red); }
      #compass .n2 { fill: var(--wien-red-dark); }
      #compass .s1 { fill: var(--wien-border); }
      #compass .s2 { fill: var(--wien-border-strong); }
      #compass .c-pivot { fill: var(--wien-bg); stroke: var(--wien-text); stroke-width: 1.2; }
      #compass .c-dir { fill: var(--wien-text); font: 700 12px var(--font); text-anchor: middle; dominant-baseline: central; }
      #compass .c-dir.north { fill: var(--wien-red); font-size: 13.5px; }
      #compass .c-mark { fill: var(--wien-red); }
      @media (max-width: 600px), (max-height: 500px) { #compass { width: 68px; height: 68px; } }

      kbd, .cols b { display: inline-block; min-width: 18px; padding: 0 6px; margin-right: 6px; border: 1px solid var(--wien-border-strong); border-bottom-width: 2px; border-radius: var(--wien-radius); background: var(--wien-bg-alt); color: var(--wien-text);
        text-align: center; font: 600 11.5px/19px var(--font); }

      /* start / pause screen */
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #00000080; cursor: pointer; }
      .panel { box-sizing: border-box; max-width: 680px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 22px 26px; background: var(--wien-bg); border: 1px solid var(--wien-border-strong); border-top: 4px solid var(--wien-red); border-radius: var(--wien-radius); box-shadow: var(--wien-shadow-modal); }
      .panel h1 { margin: 0; font-size: 26px; font-weight: 700; }
      .panel h1 span { color: var(--wien-red); }
      .panel .sub { margin: 2px 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--wien-border); color: var(--wien-text-muted); font-size: 14px; }
      .panel h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .cols { display: flex; flex-wrap: wrap; gap: 18px 36px; font-size: 14px; }
      .cols ul { list-style: none; margin: 0; padding: 0; line-height: 1.85; }
      .cols li.lead { margin-bottom: 8px; }
      .start { display: block; margin: 22px auto 0; padding: 10px 26px; border: 1px solid var(--wien-red); border-radius: var(--wien-radius); background: var(--wien-red); color: #fff; font: 600 16px var(--font); cursor: pointer; transition: background .15s; }
      .start:hover { background: var(--wien-red-dark); border-color: var(--wien-red-dark); }
      .credits { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--wien-border); font-size: 11px; line-height: 1.5; color: var(--wien-text-muted); }
      .credits a { color: inherit; }
      #places li { cursor: pointer; border-radius: var(--wien-radius); }
      #places li:hover { background: var(--wien-red-light); }
      .play-hint { margin: 22px 0 0; text-align: center; color: var(--wien-red); font-size: 16px; font-weight: 600; animation: hint-pulse 2.4s ease-in-out infinite; }
      @keyframes hint-pulse { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .play-hint { animation: none; } }
      .menu-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
      .menu-row .start { margin: 0; }
      .start.secondary { background: var(--wien-bg); color: var(--wien-red); }
      .start.secondary:hover { background: var(--wien-red-light); }
      /* touch screens get touch instructions instead of keyboard ones */
      .touch-only { display: none; }
      @media (hover: none) and (pointer: coarse) { .kb-only { display: none; } .touch-only { display: revert; } }

      /* info + POI boxes */
      .card { position: fixed; box-sizing: border-box; background: var(--wien-bg); color: var(--wien-text); border: 1px solid var(--wien-border-strong); border-top: 4px solid var(--wien-red); border-radius: var(--wien-radius); box-shadow: var(--wien-shadow-modal); font-size: 13px; }
      .card h2 { margin: 2px 44px 12px 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
      .card h3 { margin: 16px 0 6px; padding-top: 10px; border-top: 1px solid var(--wien-border); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .card .muted { color: var(--wien-text-muted); }
      .card .kicker { display: inline-flex; margin-bottom: 6px; padding: 2px 8px; border-radius: var(--wien-radius); background: var(--wien-red-light); color: var(--wien-red-dark); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .card table { border-collapse: collapse; width: 100%; }
      .card tr + tr { border-top: 1px solid #ececec; }
      .card th { text-align: left; font-weight: 600; color: var(--wien-text-muted); padding: 5px 12px 5px 0; vertical-align: top; white-space: nowrap; }
      .card td { padding: 5px 0; overflow-wrap: anywhere; }
      .card ul { margin: 0; padding-left: 18px; line-height: 1.7; }
      .close { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0 0 2px; border: 1px solid var(--wien-border); border-radius: 50%; background: var(--wien-bg);
        color: var(--wien-text); font: 22px/1 var(--font); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
      .close:hover { background: var(--wien-red); border-color: var(--wien-red); color: #fff; }
      #info-panel { right: 16px; top: 16px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; padding: 16px 18px; }
      #mouse-mode { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none; white-space: nowrap; background: var(--wien-bg); border: 1px solid var(--wien-border); border-left: 4px solid var(--wien-red);
        border-radius: var(--wien-radius); box-shadow: var(--wien-shadow-strong); padding: 7px 14px; font-size: 13px; }

      #settings-panel { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; padding: 16px 18px; }
      #settings-panel header { display: flex; gap: 8px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--wien-border); }
      #settings-panel h2 { margin: 0; flex: 1; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
      #settings-panel .close { position: static; flex: none; }
      #settings-body { overflow-y: auto; padding-bottom: 4px; accent-color: var(--wien-red); }
      #legal-panel { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; padding: 16px 18px; }
      #legal-panel header { display: flex; gap: 8px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--wien-border); }
      #legal-panel h2 { margin: 0; flex: 1; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
      #legal-panel .close { position: static; flex: none; }
      #legal-body { overflow-y: auto; line-height: 1.55; }
      #legal-body h3:first-child { border-top: 0; padding-top: 0; }
      #legal-body p { margin: 0 0 8px; }
      #legal-body ul { margin-bottom: 8px; }
      #settings-body h3:first-child { border-top: 0; padding-top: 0; }
      .set-row { display: grid; grid-template-columns: 1fr minmax(110px, 40%); gap: 2px 12px; align-items: center; padding: 6px 0; font-size: 13.5px; }
      .set-row > span { grid-row: span 2; }
      .set-row small { display: block; color: var(--wien-text-muted); font-size: 11.5px; line-height: 1.4; }
      .set-row input[type=range] { width: 100%; margin: 0; }
      .set-row select { padding: 5px 8px; border: 1.5px solid #d0d0d0; border-radius: 6px; background: var(--wien-bg); color: var(--wien-text); font: 13.5px var(--font); }
      .set-row select:focus { border-color: var(--wien-red); outline: none; }
      .set-row output { font-size: 12px; color: var(--wien-text-muted); font-variant-numeric: tabular-nums; }
      .set-row.check { grid-template-columns: auto 1fr; cursor: pointer; }
      .set-row.check > span { grid-row: auto; }
      .set-row.check input { width: 18px; height: 18px; margin: 0; }
      .pad-status { margin: 4px 0 6px; padding: 8px 10px; border-left: 3px solid var(--wien-border-strong); background: var(--wien-bg-alt); font-size: 12.5px; line-height: 1.5; }
      .pad-status.ok { border-left-color: #2f9e44; }
      @media (max-width: 480px) { .set-row { grid-template-columns: 1fr; } .set-row > span { grid-row: auto; } }
      #poi-panel { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); height: min(660px, calc(100vh - 32px)); display: flex; flex-direction: column; padding: 16px 18px; }
      #poi-panel header { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--wien-border); }
      #poi-panel h2 { margin: 0; flex: 1; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
      #poi-panel .close { position: static; flex: none; }
      #poi-search { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 8px; border: 1.5px solid #d0d0d0; border-radius: 6px; background: var(--wien-bg); color: var(--wien-text); font: 14px var(--font); }
      #poi-search:focus { border-color: var(--wien-red); outline: none; }
      #poi-list { list-style: none; margin: 0 -4px; padding: 0 4px; overflow-y: auto; flex: 1; accent-color: var(--wien-red); }
      #poi-list li label { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border: 1px solid transparent; border-radius: var(--wien-radius); cursor: pointer; transition: background .12s; }
      #poi-list li label:hover { background: var(--wien-red-light); }
      #poi-list li label:has(input:checked) { border-color: var(--wien-border); border-left: 3px solid var(--wien-red); padding-left: 6px; font-weight: 600; }
      #poi-list input { margin: 0; flex: none; }
      #poi-list ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 10px; }
      #poi-list .sec + .sec { border-top: 1px solid var(--wien-border); }
      #poi-list .sec-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 8px; border: 0; border-radius: var(--wien-radius); background: none; color: var(--wien-text); cursor: pointer; text-align: left;
        font: 700 12.5px var(--font); text-transform: uppercase; letter-spacing: .04em; }
      #poi-list .sec-head:hover { background: var(--wien-bg-alt); }
      #poi-list .sec-head:focus-visible { outline: 2px solid var(--wien-red); outline-offset: -2px; }
      #poi-list .chev { width: 16px; height: 16px; flex: none; color: var(--wien-red); transition: transform .15s; }
      #poi-list .sec.open .chev { transform: rotate(90deg); }
      #poi-list .sec-on { padding: 1px 7px; border-radius: var(--wien-radius); background: var(--wien-red); color: #fff; font-size: 10.5px; letter-spacing: .02em; }
      #poi-list .empty { padding: 14px; color: var(--wien-text-muted); }
      #poi-list .ico { width: 22px; height: 22px; flex: none; }
      #poi-list .cnt { margin-left: auto; padding-left: 8px; color: var(--wien-text-muted); font-size: 12px; font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .btn { border: 1px solid var(--wien-border-strong); border-radius: var(--wien-radius); background: var(--wien-bg); color: var(--wien-text); padding: 5px 11px; font: 500 12.5px var(--font); cursor: pointer; transition: background .12s; }
      .btn:hover { background: var(--wien-bg-alt); }

      @media (max-width: 600px) { .panel { padding: 18px 16px; } .cols { font-size: 13px; }
        /* bottom sheet, so the crosshair stays visible */
        #info-panel { top: auto; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: auto; max-height: 45dvh; } }
      @media (max-height: 500px) { #info-panel { top: 12px; right: max(12px, env(safe-area-inset-right)); width: min(340px, 45vw); max-height: calc(100dvh - 24px); } }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="aim-label"></div>
    <div id="mouse-mode" class="hidden" data-i18n="mouse.hint"></div>
    <div id="corner-tl" class="corner tl"><div id="hud" class="hidden"></div><div id="compass" class="hidden" aria-hidden="true"></div></div>
    <div id="corner-tr" class="corner tr"></div>
    <div id="corner-bl" class="corner bl"></div>
    <div id="corner-br" class="corner br"></div>
    <div id="info-panel" class="card hidden">
      <button id="info-close" class="close" data-i18n-title="close.info" data-i18n-aria="close">×</button>
      <div id="info-body"></div>
    </div>
    <div id="settings-panel" class="card hidden">
      <header><h2 data-i18n="set.title"></h2><button id="settings-reset" class="btn" data-i18n="set.reset"></button><button id="settings-close" class="close" data-i18n-title="close.settings" data-i18n-aria="close">×</button></header>
      <div id="settings-body"></div>
    </div>
    <div id="poi-panel" class="card hidden">
      <header><h2 data-i18n="poi.title"></h2><button id="poi-clear" class="btn" data-i18n="poi.clear"></button><button id="poi-close" class="close" data-i18n-title="close.poi" data-i18n-aria="close">×</button></header>
      <input id="poi-search" type="search" data-i18n-placeholder="poi.search" autocomplete="off" />
      <ul id="poi-list"></ul>
    </div>
    <div id="legal-panel" class="card hidden">
      <header><h2 data-i18n="legal.title"></h2><button id="legal-close" class="close" data-i18n-title="close.settings" data-i18n-aria="close">×</button></header>
      <div id="legal-body" data-i18n="legal.body"></div>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1>Wien <span>3D</span></h1>
        <p class="sub" data-i18n="menu.sub"></p>
        <div class="cols">
          <div class="kb-only"><h3 data-i18n="menu.keyboard"></h3><ul>
            <li class="lead" data-i18n="kb.esc"></li>
            <li data-i18n="kb.1"></li>
            <li data-i18n="kb.2"></li>
            <li data-i18n="kb.3"></li>
            <li data-i18n="kb.4"></li>
            <li data-i18n="kb.5"></li>
            <li data-i18n="kb.6"></li>
            <li data-i18n="kb.7"></li>
            <li data-i18n="kb.8"></li>
            <li data-i18n="kb.9"></li>
          </ul></div>
          <div class="touch-only"><h3 data-i18n="menu.touch"></h3><ul>
            <li data-i18n="touch.1"></li>
            <li data-i18n="touch.look"></li>
            <li data-i18n="touch.rotate"></li>
            <li data-i18n="touch.4"></li>
            <li data-i18n="touch.5"></li>
            <li data-i18n="touch.6"></li>
          </ul></div>
          <div><h3 data-i18n="menu.controller"></h3><ul>
            <li data-i18n="pad.1"></li>
            <li data-i18n="pad.2"></li>
            <li data-i18n="pad.3"></li>
            <li data-i18n="pad.4"></li>
            <li data-i18n="pad.5"></li>
          </ul></div>
          <div><h3 data-i18n="menu.places"></h3><ul id="places"></ul></div>
        </div>
        <p class="play-hint" data-i18n="menu.play"></p>
        <div class="menu-row">
          <button id="menu-pois" class="start secondary" type="button" data-i18n="menu.pois"></button>
          <button id="menu-settings" class="start secondary" type="button" data-i18n="menu.settings"></button>
        </div>
        <div class="credits" data-i18n="credits"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
